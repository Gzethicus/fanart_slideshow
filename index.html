<!DOCTYPE html>
<html>
    <head>
        <meta name="robots" content="noindex">
        <script src="slideshow.js"></script>
        <style>
            img {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
            }

            @keyframes fade {
                0% {
                    opacity: 1;
                }
                
                20% {
                    opacity: 0;
                }

                100% {
                    opacity: 0;
                }
            }
        </style>
    </head>
    <body>
        <img id="static"/>
        <img id="fade" style="animation:8s fade infinite"/>
    </body>
</html>
