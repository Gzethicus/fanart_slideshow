<!DOCTYPE html>
<html>
    <head>
        <meta name="robots" content="noindex">
        <script src="slideshow.js"></script>
        <style>
            div {
                position: absolute;
                top: 0;
                left: 50%;
                height: 100%;
            }

            img {
                position: relative;
                top: 0;
                left: -50%;
                height: 100%;
            }

            @keyframes fade {
                0% {
                    opacity: 1;
                }
                
                20% {
                    opacity: 0;
                }

                100% {
                    opacity: 0;
                }
            }
            
            @keyframes fade-in {
                0% {
                    opacity: 0;
                }
                
                20% {
                    opacity: 1;
                }

                100% {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>
        <div>
            <img id="static" style="animation:8s fade-in infinite"/>
        </div>
        <div>
            <img id="fade" style="animation:8s fade infinite"/>
        </div>
    </body>
</html>
